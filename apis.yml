name: Neocis
description: 'Neocis is a medical robotics company and the maker of Yomi, described as the first and only
  FDA-cleared robot-assisted dental surgery system. Yomi combines preoperative implant planning software
  with intraoperative haptic robotic guidance to assist dentists during dental implant placement procedures.
  The company sells hardware, planning software, and practitioner training to dental practices rather than
  operating a public developer platform. Neocis is a portfolio company of Norwest Venture Partners. As of
  this profile it publishes no public API, developer portal, SDK, or webhook surface.'
